# Copy to a Git-ignored private config and replace every /absolute/path value.
# The runner process is short-lived and returns only detector-scan-result-v1 JSON.
[detector]
backend = "yolo_command"
yolo_model_path = "/absolute/path/to/yolo11n.pt"
yolo_manifest_path = "/absolute/path/to/yolo11n-coco.reviewed.example.json"
yolo_runner_command = [
  "/absolute/path/to/yolo-runtime/bin/python",
  "-m", "baby_monitor.local_runners.yolo_detector",
  "{request}"
]
yolo_runner_timeout_seconds = 600.0
# Set an absolute path under an existing private (0700) runtime directory when
# multiple candidate workers share one GPU. Empty keeps cross-process locking off.
yolo_execution_lock_path = ""
yolo_execution_lock_timeout_seconds = 600.0
device = "0"
confidence = 0.35
sample_fps = 1.0
image_size = 640
rotation_degrees = 0
candidate_gap_seconds = 3.0
labels = ["person", "bus"]
